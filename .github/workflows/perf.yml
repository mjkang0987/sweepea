name: perf

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # 예산(LCP 1.8초, CLS 0.05, JS 50KB, 접근성 100점)을 넘으면 실패 → 머지하지 않는다.
      - run: npm run perf
